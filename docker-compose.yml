services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: application_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d application_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    image: coachtommy-backend
    container_name: coachtommy-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/application_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=http://backend:8000/api
    image: coachtommy-frontend
    container_name: coachtommy-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
