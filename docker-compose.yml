services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: application_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d application_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    image: coachtommy-backend
    container_name: coachtommy-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/application_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      STRAVA_REDIRECT_URI: ${STRAVA_REDIRECT_URI:-}
      STRAVA_ENCRYPTION_KEY: ${STRAVA_ENCRYPTION_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  notification-worker:
    build: ./backend
    image: coachtommy-backend
    restart: always
    command: ["python", "-m", "app.notification_worker"]
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/application_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
        - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    image: coachtommy-frontend
    container_name: coachtommy-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
